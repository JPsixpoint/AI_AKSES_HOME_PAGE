<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#111827;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1F2937;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:0.4" />
    </linearGradient>
  </defs>
  
  <!-- Background Rectangle -->
  <rect width="300" height="300" rx="20" fill="url(#grad1)"/>
  
  <!-- Hexagon Grid Pattern -->
  <g opacity="0.2">
    <circle cx="150" cy="150" r="120" fill="none" stroke="#3B82F6" stroke-width="2" stroke-dasharray="4 6" />
    <circle cx="150" cy="150" r="80" fill="none" stroke="#3B82F6" stroke-width="2" stroke-dasharray="4 6" />
    <circle cx="150" cy="150" r="40" fill="none" stroke="#3B82F6" stroke-width="2" stroke-dasharray="4 6" />
  </g>
  
  <!-- Profile Silhouette -->
  <g fill="#3B82F6" opacity="0.6">
    <circle cx="150" cy="115" r="45" />
    <path d="M95,220 C95,180 205,180 205,220 L205,240 C205,245 200,250 195,250 L105,250 C100,250 95,245 95,240 Z" />
  </g>
  
  <!-- Micro Circuit Pattern -->
  <g fill="none" stroke="#fff" stroke-width="1" opacity="0.1">
    <path d="M50,60 L120,60 L120,90" />
    <path d="M230,50 L230,100 L200,100" />
    <path d="M60,240 L60,200 L90,200" />
    <path d="M240,220 L200,220 L200,240" />
    <circle cx="120" cy="90" r="3" fill="#fff" />
    <circle cx="200" cy="100" r="3" fill="#fff" />
    <circle cx="90" cy="200" r="3" fill="#fff" />
    <circle cx="200" cy="240" r="3" fill="#fff" />
  </g>
  
  <!-- AI Label -->
  <g>
    <text x="150" y="285" font-family="Arial, sans-serif" font-size="12" fill="#fff" text-anchor="middle">AI Assistant</text>
  </g>
</svg>