<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#1A1A2E" rx="15" ry="15" />
  
  <!-- Avatar silhouette -->
  <g transform="translate(150, 150)">
    <!-- Head -->
    <circle cx="0" cy="-30" r="60" fill="#2D3047" />
    
    <!-- Body -->
    <path d="M-40,30 C-40,60 40,60 40,30 L40,120 L-40,120 Z" fill="#2D3047" />
    
    <!-- Face placeholder -->
    <circle cx="-20" cy="-30" r="5" fill="#4E5283" />
    <circle cx="20" cy="-30" r="5" fill="#4E5283" />
    <path d="M-15,0 C-5,10 15,10 15,0" fill="none" stroke="#4E5283" stroke-width="3" stroke-linecap="round" />
    
    <!-- SixPoint logo stylistic element -->
    <g transform="translate(0, -110) scale(0.5)">
      <polygon points="0,0 30,50 0,100 -30,50" fill="none" stroke="#43B0F1" stroke-width="2" />
      <polygon points="0,20 20,50 0,80 -20,50" fill="none" stroke="#43B0F1" stroke-width="2" />
    </g>
  </g>
  
  <!-- Bottom text -->
  <text x="150" y="270" font-family="Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">AKSES AI Assistant</text>
</svg>